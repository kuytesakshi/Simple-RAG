<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" font-family="sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrD" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="800" fill="#fbfefd"/>

  <text x="600" y="38" text-anchor="middle" font-size="24" font-weight="800" fill="#0f766e">Simple RAG — Architecture</text>

  <!-- ============ SYSTEM ============ -->
  <text x="30" y="78" font-size="15" font-weight="800" fill="#134e4a">SYSTEM</text>

  <g font-size="13" fill="#123332">
    <rect x="30" y="95" width="190" height="110" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="125" y="122" text-anchor="middle" font-weight="800">Browser</text>
    <text x="125" y="143" text-anchor="middle">Next.js :3000/rag</text>
    <text x="125" y="164" text-anchor="middle">login + chat UI</text>
    <text x="125" y="185" text-anchor="middle">history sidebar</text>

    <rect x="270" y="95" width="220" height="110" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="380" y="122" text-anchor="middle" font-weight="800">Backend — FastAPI :8000</text>
    <text x="380" y="143" text-anchor="middle">auth (JWT) • chat • ingest</text>
    <text x="380" y="164" text-anchor="middle">loader → chunk → embed</text>
    <text x="380" y="185" text-anchor="middle">classify → answer chain</text>

    <rect x="540" y="95" width="220" height="110" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="650" y="122" text-anchor="middle" font-weight="800">Postgres :5432 + pgvector</text>
    <text x="650" y="143" text-anchor="middle">users • documents</text>
    <text x="650" y="164" text-anchor="middle">document_chunks (384-d)</text>
    <text x="650" y="185" text-anchor="middle">conversations • messages</text>

    <rect x="810" y="95" width="180" height="110" rx="12" fill="#fef9c3" stroke="#d97706" stroke-width="2"/>
    <text x="900" y="122" text-anchor="middle" font-weight="800">Groq Cloud</text>
    <text x="900" y="143" text-anchor="middle">openai/gpt-oss-20b</text>
    <text x="900" y="164" text-anchor="middle">classify • rewrite • answer</text>

    <rect x="1020" y="95" width="150" height="110" rx="12" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/>
    <text x="1095" y="122" text-anchor="middle" font-weight="800">Adminer :8080</text>
    <text x="1095" y="143" text-anchor="middle">DB UI</text>
    <text x="1095" y="164" text-anchor="middle">server: db</text>
  </g>

  <g stroke-width="2" fill="none">
    <line x1="220" y1="150" x2="264" y2="150" stroke="#0f766e" marker-end="url(#arr)"/>
    <line x1="490" y1="150" x2="534" y2="150" stroke="#0f766e" marker-end="url(#arr)"/>
    <line x1="760" y1="150" x2="804" y2="150" stroke="#0f766e" marker-end="url(#arr)"/>
  </g>
  <g font-size="11" fill="#0f766e">
    <text x="242" y="140" text-anchor="middle">JWT/api</text>
    <text x="512" y="140" text-anchor="middle">SQL</text>
    <text x="782" y="140" text-anchor="middle">chat</text>
  </g>

  <rect x="270" y="222" width="220" height="56" rx="10" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="380" y="245" text-anchor="middle" font-size="12" fill="#475569">HF embeddings, baked in image</text>
  <text x="380" y="262" text-anchor="middle" font-size="12" fill="#475569">all-MiniLM-L6-v2 (free, local)</text>

  <g stroke-width="2" fill="none">
    <line x1="1095" y1="205" x2="760" y2="205" stroke="#94a3b8" marker-end="url(#arrD)"/>
  </g>
  <text x="927" y="196" text-anchor="middle" font-size="11" fill="#64748b">SQL (docker net)</text>

  <!-- ============ ASK FLOW ============ -->
  <text x="30" y="322" font-size="15" font-weight="800" fill="#134e4a">ASK FLOW — POST /api/conversations/{id}/ask</text>

  <g font-size="13" fill="#123332">
    <rect x="30" y="350" width="180" height="110" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="120" y="380" text-anchor="middle" font-weight="800">ask + history</text>
    <text x="120" y="401" text-anchor="middle">this thread's last N</text>
    <text x="120" y="422" text-anchor="middle">msgs only (CHAT_</text>
    <text x="120" y="443" text-anchor="middle">HISTORY_TURNS)</text>

    <rect x="250" y="350" width="150" height="110" rx="12" fill="#fef9c3" stroke="#d97706" stroke-width="2"/>
    <text x="325" y="380" text-anchor="middle" font-weight="800">CLASSIFY</text>
    <text x="325" y="401" text-anchor="middle">Groq, temp 0</text>
    <text x="325" y="422" text-anchor="middle">exactly 1 word</text>
  </g>

  <g font-size="13" fill="#123332">
    <rect x="440" y="345" width="130" height="56" rx="10" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
    <text x="505" y="379" text-anchor="middle" font-weight="800">greeting</text>
    <rect x="585" y="345" width="300" height="56" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="735" y="368" text-anchor="middle">LLM chat reply (history for tone)</text>
    <text x="735" y="388" text-anchor="middle">no retrieval, sources = []</text>

    <rect x="440" y="415" width="130" height="56" rx="10" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
    <text x="505" y="449" text-anchor="middle" font-weight="800">history</text>
    <rect x="585" y="415" width="300" height="56" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="735" y="438" text-anchor="middle">LLM over transcript only</text>
    <text x="735" y="458" text-anchor="middle">quote/summarize, sources = []</text>

    <rect x="440" y="485" width="130" height="76" rx="10" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="505" y="519" text-anchor="middle" font-weight="800">documents</text>
    <rect x="585" y="485" width="300" height="76" rx="10" fill="#f0fdf4" stroke="#0d9488" stroke-width="1.5"/>
    <text x="735" y="508" text-anchor="middle">rewrite → top-k retrieve</text>
    <text x="735" y="528" text-anchor="middle">→ strict grounded answer</text>
    <text x="735" y="548" text-anchor="middle">sources = [chunk_ids]</text>

    <rect x="440" y="575" width="130" height="56" rx="10" fill="#ffe4e6" stroke="#fb7185" stroke-width="2"/>
    <text x="505" y="609" text-anchor="middle" font-weight="800">off-scope</text>
    <rect x="585" y="575" width="300" height="56" rx="10" fill="#fff1f2" stroke="#fb7185" stroke-width="1.5"/>
    <text x="735" y="598" text-anchor="middle">instant REFUSAL, zero calls</text>
    <text x="735" y="618" text-anchor="middle">no retrieval spent</text>

    <rect x="925" y="430" width="245" height="130" rx="12" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/>
    <text x="1047" y="460" text-anchor="middle" font-weight="800">Persist + respond</text>
    <text x="1047" y="481" text-anchor="middle">save user + bot msgs</text>
    <text x="1047" y="502" text-anchor="middle">auto-retitle new threads</text>
    <text x="1047" y="523" text-anchor="middle">{answer, sources}</text>
  </g>

  <g stroke-width="2" fill="none" stroke="#0f766e">
    <line x1="210" y1="405" x2="244" y2="405" marker-end="url(#arr)"/>
    <line x1="400" y1="380" x2="434" y2="373" marker-end="url(#arr)"/>
    <line x1="400" y1="400" x2="434" y2="443" marker-end="url(#arr)"/>
    <line x1="400" y1="415" x2="434" y2="513" marker-end="url(#arr)"/>
    <line x1="400" y1="430" x2="434" y2="603" marker-end="url(#arr)"/>
    <line x1="885" y1="373" x2="919" y2="460" marker-end="url(#arr)"/>
    <line x1="885" y1="443" x2="919" y2="475" marker-end="url(#arr)"/>
    <line x1="885" y1="523" x2="919" y2="495" marker-end="url(#arr)"/>
    <line x1="885" y1="603" x2="919" y2="520" marker-end="url(#arr)"/>
  </g>

  <text x="30" y="680" font-size="12" fill="#5b7a78">Isolation: history is always filtered by conversation_id (+ owner check) — other threads are never loaded.</text>
  <text x="30" y="700" font-size="12" fill="#5b7a78">Cost per turn: 2 Groq calls normally (classify + answer), 3 on document follow-ups (+ rewrite). First questions skip rewrite.</text>
  <text x="30" y="720" font-size="12" fill="#5b7a78">Knobs (backend/.env): CHUNK_SIZE • CHUNK_OVERLAP • RETRIEVAL_TOP_K • CHAT_HISTORY_TURNS • GROQ_MODEL</text>
  <text x="30" y="760" font-size="12" fill="#5b7a78">Ports: frontend :3000/rag • backend :8000 • postgres :5432 • adminer :8080</text>
</svg>
