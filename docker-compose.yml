services:
  db:
    image: pgvector/pgvector:pg16
    container_name: simple-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB: ${POSTGRES_DB:-ragdb}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragdb}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simple-rag-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # All values come from backend/.env (passed via --env-file, see README).
    # No root .env is used.
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpass}@db:5432/${POSTGRES_DB:-ragdb}
      DATA_DIR: /app/Data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/Data:/app/Data:ro
      # live-reload for dev; remove in prod
      - ./backend:/app

volumes:
  pgdata:
